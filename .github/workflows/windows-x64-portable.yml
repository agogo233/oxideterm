name: Windows x64 Portable

on:
  workflow_dispatch:
  push:
    branches: [main, experiment/rust-native-v2]

permissions:
  contents: read

concurrency:
  group: windows-x64-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-portable:
    name: Build Windows x64 portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: windows-x64-portable-x86_64-pc-windows-msvc
          cache-on-failure: true

      - name: Install Windows packaging dependencies
        shell: pwsh
        env:
          NSIS_VERSION: '3.12'
          NSIS_ARCHIVE_SHA256: '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
        run: |
          $archiveName = "nsis-$env:NSIS_VERSION.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $downloadUrl = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$env:NSIS_VERSION/$archiveName"
          curl.exe --fail --location --retry 3 --retry-all-errors `
            --output $archivePath $downloadUrl
          $archiveHash = (Get-FileHash -Algorithm SHA256 -Path $archivePath).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:NSIS_ARCHIVE_SHA256) {
            throw "NSIS archive checksum mismatch: $archiveHash"
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION-portable"
          Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force
          $nsisBin = Join-Path $extractRoot "nsis-$env:NSIS_VERSION"
          if (-not (Test-Path (Join-Path $nsisBin 'makensis.exe'))) {
            throw 'makensis.exe is missing from the verified NSIS archive.'
          }
          $nsisBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw '7-Zip is missing from the GitHub-hosted Windows runner.'
          }

      - name: Resolve workspace version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package native app
        run: python scripts/release/package_native.py x86_64-pc-windows-msvc

      - name: Verify native package contents
        run: >-
          python scripts/release/verify_native_package.py
          --target x86_64-pc-windows-msvc
          --version ${{ steps.version.outputs.version }}
          --dist dist

      - name: Unpack portable package for artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path dist -Filter 'OxideTerm_*_windows_x64_portable.zip' | Select-Object -First 1
          if (-not $zip) { throw 'portable zip not found' }
          $artifactRoot = Join-Path dist 'artifact'
          if (Test-Path $artifactRoot) { Remove-Item -Recurse -Force $artifactRoot }
          # 7z preserves the empty data/plugins directory that Expand-Archive drops.
          & 7z x $zip.FullName "-o$artifactRoot" -y

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OxideTerm-windows-x64-portable
          path: dist/artifact
          if-no-files-found: error